name: Storyteller protection checks
on:
  pull_request:
  push:
    branches: [work/storyteller-protection-20261109, work/storyteller-benefits-20261110]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser smoke and offline checks
        run: |
          npm run preview -- --port 4173 > /tmp/pamchenga-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4173/ > /dev/null; then break; fi
            sleep 1
          done
          node tests/browser.mjs
